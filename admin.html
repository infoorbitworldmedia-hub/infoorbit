<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfoOrbit Admin</title><style>body{font-family:system-ui;background:#070b12;color:#f4f7fb;max-width:900px;margin:auto;padding:30px}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #26384d;background:#0d1420;color:#fff;width:100%;margin:6px 0 12px}button{cursor:pointer;background:#eaf6ff;color:#07101a;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #223044;background:#0d1420;border-radius:14px;padding:20px;margin-bottom:18px}.muted{color:#8e9caf}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>InfoOrbit Admin</h1><p class="muted">Private publishing dashboard. Keep your admin token secret.</p><div class="card"><label>Admin token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"></div><div class="grid"><form class="card" id="story"><h2>Publish story</h2><input name="title" required placeholder="Headline"><input name="category" placeholder="World / Business / Tech"><textarea name="summary" required rows="6" placeholder="Short verified summary"></textarea><button>Publish</button><p id="storyStatus" class="muted"></p></form><div class="card"><h2>Inbox</h2><button id="load">Load messages & subscribers</button><pre id="output" style="white-space:pre-wrap;max-height:500px;overflow:auto"></pre></div></div><div class="card"><h2>Published stories</h2><button id="stories">Load stories</button><pre id="storyOutput" style="white-space:pre-wrap"></pre></div><script>const token=()=>document.getElementById('token').value;const headers=()=>({'Content-Type':'application/json','x-admin-token':token()});document.getElementById('story').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/admin/stories',{method:'POST',headers:headers(),body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();document.getElementById('storyStatus').textContent=d.error||'Published successfully.';if(r.ok)e.target.reset()};document.getElementById('load').onclick=async()=>{const [m,s]=await Promise.all([fetch('/api/admin/messages',{headers:headers()}),fetch('/api/admin/subscribers',{headers:headers()})]);document.getElementById('output').textContent=JSON.stringify({messages:await m.json(),subscribers:await s.json()},null,2)};document.getElementById('stories').onclick=async()=>{const r=await fetch('/api/stories');document.getElementById('storyOutput').textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
